# Nginx untuk Pantau Generus di VPS. Salin ke /etc/nginx/sites-available/generus,
# ganti DOMAIN_APP & DOMAIN_API, lalu:
#   sudo ln -s /etc/nginx/sites-available/generus /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d DOMAIN_APP -d DOMAIN_API
# HTTPS wajib: aplikasi PWA (pasang di HP) dan kamera pemindai QR hanya jalan di HTTPS.

# Aplikasi web (Next.js, PM2 di port 3000)
server {
    listen 80;
    server_name DOMAIN_APP;

    # Import Excel generus maksimal 5 MB (+ overhead).
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Aset build Next.js berumur panjang (nama file sudah mengandung hash).
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# API Supabase self-hosted (Kong di port 8000): login, PostgREST untuk aplikasi
# Android, dan Edge Function admin-akun. Studio TIDAK dibuka ke publik.
server {
    listen 80;
    server_name DOMAIN_API;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
