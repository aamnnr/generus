<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>Offline · Generus</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: #171717;
        padding: 16px;
        box-sizing: border-box;
      }
      @media (prefers-color-scheme: dark) { body { background: #0a0a0a; color: #ededed; } p { color: #a3a3a3; } }
      main { max-width: 22rem; text-align: center; }
      .logo { width: 56px; height: 56px; border-radius: 12px; margin: 0 auto 16px; }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { color: #525252; line-height: 1.5; margin: 0 0 20px; }
      button {
        font: inherit; font-weight: 600; color: #fff; background: #0f766e;
        border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/icons/icon-192.png" alt="" />
      <h1>Anda sedang offline</h1>
      <p>Halaman ini butuh koneksi internet. Periksa sinyal atau Wi-Fi, lalu coba lagi.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
    <script>
      // Muat ulang otomatis saat koneksi kembali. Selain event "online", cek
      // berkala karena HP bisa tetap "online" tanpa akses internet (sinyal lemah).
      addEventListener("online", () => location.reload());
      setInterval(async () => {
        try {
          const res = await fetch("/manifest.webmanifest", { cache: "no-store" });
          if (res.ok) location.reload();
        } catch {
          // Masih offline.
        }
      }, 5000);
    </script>
  </body>
</html>
